<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#f5f7f2"/>
<rect x="0" y="0" width="1200" height="8" fill="#9bd9c8"/>
<rect x="0" y="8" width="12" height="892" fill="#172420"/>
<text x="72" y="58" font-family="Arial" font-size="22" fill="#505e58" stroke="#505e58" stroke-width="0">FIELD GUIDE / EQUIPMENT</text>
<text x="970" y="58" font-family="Arial" font-size="22" fill="#505e58" stroke="#505e58" stroke-width="0">DOC / 02</text>
<ellipse cx="1050.0" cy="132.0" rx="40.0" ry="40.0" fill="none" stroke="#badacc" stroke-width="2"/>
<rect x="1010" y="92" width="40" height="40" fill="#dcece5"/>
<text x="72" y="137" font-family="SimSun" font-size="52" fill="#172420" stroke="#172420" stroke-width="1">设备借用、异地采样与归还记录操作说明</text>
<rect x="72" y="242" width="185" height="38" fill="#172420"/>
<text x="87" y="268" font-family="Microsoft YaHei" font-size="23" fill="#f5f7f2" stroke="#f5f7f2" stroke-width="0">01 / 预约</text>
<text x="292" y="267" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">填写设备类型、采样地点与借用时段，并说明是否需要备用电池。</text>
<text x="292" y="309" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">预约确认后领取编号；若计划变更，请提前更新记录，避免</text>
<text x="292" y="349" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">重复预留。</text>
<line x1="292" y1="390" x2="1128" y2="390" stroke="#b7c8bf" stroke-width="1"/>
<rect x="72" y="468.0" width="185" height="38" fill="#172420"/>
<text x="87" y="493.0" font-family="Microsoft YaHei" font-size="23" fill="#f5f7f2" stroke="#f5f7f2" stroke-width="0">02 / 领取</text>
<text x="292" y="493.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">出示预约编号，与工作人员共同核对设备外观、附件数量和剩余电</text>
<text x="292" y="535.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">量。首次使用者须完成现场操作说明；发现异常请在离场前登记。</text>
<line x1="292" y1="574.0" x2="1128" y2="574.0" stroke="#b7c8bf" stroke-width="1"/>
<rect x="72" y="652.0" width="185" height="38" fill="#172420"/>
<text x="87" y="677.0" font-family="Microsoft YaHei" font-size="23" fill="#f5f7f2" stroke="#f5f7f2" stroke-width="0">03 / 归还</text>
<text x="292" y="677.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">按约定时间归还设备及全部附件，并提交采样地点和使用情况记</text>
<text x="292" y="719.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">录。工作人员检查后完成归还；需要延长借用时，请先联系现场工</text>
<text x="292" y="759.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">作人员。</text>
<line x1="292" y1="800.0" x2="1128" y2="800.0" stroke="#b7c8bf" stroke-width="1"/>
<line x1="72" y1="823" x2="1128" y2="823" stroke="#172420" stroke-width="1"/>
<text x="72" y="857" font-family="Microsoft YaHei" font-size="20" fill="#505e58" stroke="#505e58" stroke-width="0">原创示例 · 未经确认请勿转借；异地采样结束后，请保持设备清洁并备份自己的采样文件。</text>
</svg>