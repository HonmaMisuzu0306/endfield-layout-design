<text x="292" y="743.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">按约定时间归还设备，工作人员检查后完成记录。</text>
<line x1="292" y1="800.0" x2="1128" y2="800.0" stroke="#b7c8bf" stroke-width="1"/>
