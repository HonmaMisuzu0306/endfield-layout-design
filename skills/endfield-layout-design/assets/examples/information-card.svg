<text x="87" y="268" font-family="Microsoft YaHei" font-size="23" fill="#f5f7f2" stroke="#f5f7f2" stroke-width="0">01 / 预约</text>
<text x="292" y="267" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">填写设备类型与借用时段，确认后领取预约编号。</text>
<line x1="292" y1="324" x2="1128" y2="324" stroke="#b7c8bf" stroke-width="1"/>
<rect x="72" y="480.0" width="185" height="38" fill="#172420"/>
<text x="87" y="505.0" font-family="Microsoft YaHei" font-size="23" fill="#f5f7f2" stroke="#f5f7f2" stroke-width="0">02 / 领取</text>
<text x="292" y="505.0" font-family="Microsoft YaHei" font-size="28" fill="#172420" stroke="#172420" stroke-width="0">出示预约编号，核对设备状态与附件数量。</text>
<line x1="292" y1="562.0" x2="1128" y2="562.0" stroke="#b7c8bf" stroke-width="1"/>
<rect x="72" y="718.0" width="185" height="38" fill="#172420"/>
